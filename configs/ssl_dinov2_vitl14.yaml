# Overrides of dinov2/configs/ssl_default_config.yaml for CONTINUED pretraining of ViT-L/14 from the released weights.
# Phase A smoke test values (my choices, to be revised with mentors): short schedule, low LR, fresh DINO/iBOT heads.
# Keys must exist in ssl_default_config.yaml: the trainer fails on unknown keys (check on the pod).
train:
  batch_size_per_gpu: 48
  OFFICIAL_EPOCH_LENGTH: 200
  num_workers: 12
  saveckp_freq: 100
student:
  arch: vit_large
  patch_size: 14
  drop_path_rate: 0.2
  layerscale: 1.0e-05
  ffn_layer: mlp
  block_chunks: 0
teacher:
  momentum_teacher: 0.996
  warmup_teacher_temp_epochs: 1
optim:
  epochs: 10  # the 45-minute timeout stops it earlier if needed; metrics are written as training goes
  warmup_epochs: 1
  base_lr: 1.0e-04
  layerwise_decay: 0.9
crops:
  global_crops_size: 224
  local_crops_size: 98
